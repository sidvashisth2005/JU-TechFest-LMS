; ESP-NOW gateway: one ESP32 plugged into the Pi (or laptop) by USB.
; Collars in mode "espnow" broadcast readings; this board prints each one as a JSON line on
; USB serial, and barn/serial_bridge.py forwards the lines to MQTT - the rest of the
; pipeline is unchanged.
;   pio run -t upload          then on the Pi:  python -m barn.serial_bridge --port /dev/ttyUSB0
[env:gateway]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DESPNOW_CHANNEL=1
