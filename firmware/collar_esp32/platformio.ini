; LMS cattle collar: ESP32 + MAX30102 + MPU6050 + DS18B20.
; Copy include/lms_config.example.h to include/lms_config.h and fill in Wi-Fi/MQTT first.
;
; Three ways to run it (pick with -e):
;   pio run -e wifi -t upload         always on, MQTT over Wi-Fi every REPORT_SECONDS (demo; ~12-15 h battery)
;   pio run -e wifi_sleep -t upload   wake every SLEEP_SECONDS, measure, send over Wi-Fi, deep sleep (days)
;   pio run -e espnow -t upload       same duty cycle, sends over ESP-NOW to firmware/gateway_espnow (weeks)
; Logs: pio device monitor

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    electroniccats/MPU6050 @ ^1.3.1
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4

[env:wifi]
build_flags = -DMQTT_MAX_PACKET_SIZE=512 -DLMS_MODE_WIFI

[env:wifi_sleep]
build_flags = -DMQTT_MAX_PACKET_SIZE=512 -DLMS_MODE_WIFI_SLEEP

[env:espnow]
build_flags = -DLMS_MODE_ESPNOW
