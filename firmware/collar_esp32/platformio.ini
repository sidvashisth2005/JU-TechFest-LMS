; LMS cattle collar: ESP32 + pulse sensor (MAX30102 / MAX30100 / DFRobot SEN0344 / analog)
; + MPU6050-family accelerometer + optional DS18B20. Flash, then set Wi-Fi/MQTT over serial:
;   pio run -e wifi -t upload && pio device monitor      then type: help
;
; Modes (pick with -e). Classic ESP32 DevKit / WROOM-32:
;   wifi         always on, MQTT over Wi-Fi every REPORT_SECONDS (demo; ~12-15 h battery)
;   wifi_sleep   wake every SLEEP_SECONDS, measure, send over Wi-Fi, deep sleep (days)
;   espnow       same duty cycle, sends over ESP-NOW to firmware/gateway_espnow (weeks)
; ESP32-C3 boards (SuperMini, DevKitM): wifi_c3, espnow_c3. Other boards: copy an env and change `board`.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../shared
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    oxullo/MAX30100lib @ ^1.2.1
    https://github.com/DFRobot/DFRobot_BloodOxygen_S.git
    https://github.com/DFRobot/DFRobot_RTU.git
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4

[env:wifi]
build_flags = -DMQTT_MAX_PACKET_SIZE=512 -DLMS_MODE_WIFI

[env:wifi_sleep]
build_flags = -DMQTT_MAX_PACKET_SIZE=512 -DLMS_MODE_WIFI_SLEEP

[env:espnow]
build_flags = -DLMS_MODE_ESPNOW

[c3]
board = esp32-c3-devkitm-1
; serial over the C3's own USB port
c3_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:wifi_c3]
board = ${c3.board}
build_flags = -DMQTT_MAX_PACKET_SIZE=512 -DLMS_MODE_WIFI ${c3.c3_flags}

[env:espnow_c3]
board = ${c3.board}
build_flags = -DLMS_MODE_ESPNOW ${c3.c3_flags}
