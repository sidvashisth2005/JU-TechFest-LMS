; LMS cattle collar: ESP32 + MAX30102 + MPU6050 + DS18B20, publishing to MQTT.
; Build:  pio run          Flash:  pio run -t upload          Logs:  pio device monitor
; Copy include/lms_config.example.h to include/lms_config.h and fill in Wi-Fi/MQTT first.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    electroniccats/MPU6050 @ ^1.3.1
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
build_flags = -DMQTT_MAX_PACKET_SIZE=512
