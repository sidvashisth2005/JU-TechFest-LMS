; Arduino UNO wearable prototype (the hackathon hardware): MAX30102 + MPU6050 on I2C,
; one JSON line per reading over USB serial at 115200. barn/serial_bridge.py on the Pi
; forwards each line to MQTT as lms/collar/<ANIMAL_ID>/vitals.
;
; Uses the SparkFun MAX3010x library, which works with generic MAX30102 breakouts.
; (The old sketch used DFRobot_BloodOxygen_S, which only works with the DFRobot SEN0344 module.)

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    electroniccats/MPU6050 @ ^1.3.1
