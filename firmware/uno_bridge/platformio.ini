; Arduino UNO backup collar (no radio): pulse sensor + MPU6050 on I2C, one JSON line per
; reading over USB serial at 115200. barn/serial_bridge.py (laptop or Pi) forwards each line to
; MQTT as lms/collar/<ANIMAL_ID>/vitals. Use it if the ESP32 collar fails on the day.
;
; One env per pulse sensor board (the UNO's 2 KB RAM fits only one driver):
;   pio run -e uno -t upload            generic MAX30102 / MAX30105 breakout (SparkFun library)
;   pio run -e uno_max30100 -t upload   MAX30100 module (+ DS18B20 body temp on D2)
;   pio run -e uno_dfrobot -t upload    DFRobot Gravity SEN0344 (+ DS18B20 on D2)
;   pio run -e uno_analog -t upload     analog pulse sensor on A0, heart rate only (+ DS18B20 on D2)
; Not sure which board it is? Flash any env and read the "status" line: ppg_ok false = wrong env.
; Change the animal id with -DANIMAL_ID=\"C002\" in build_flags.

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../shared

[env:uno]
build_flags = -DPPG_MAX30102
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

[env:uno_max30100]
build_flags = -DPPG_MAX30100 -DWITH_DS18B20
lib_deps =
    oxullo/MAX30100lib @ ^1.2.1
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

[env:uno_dfrobot]
build_flags = -DPPG_DFROBOT -DWITH_DS18B20
lib_deps =
    https://github.com/DFRobot/DFRobot_BloodOxygen_S.git
    https://github.com/DFRobot/DFRobot_RTU.git
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

[env:uno_analog]
build_flags = -DPPG_ANALOG -DWITH_DS18B20
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
