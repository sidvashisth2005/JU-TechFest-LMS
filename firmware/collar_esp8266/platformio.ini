; LMS cattle collar on an ESP8266 board (ESPresso Lite V2 / ESP-WROOM-02, also NodeMCU).
; GY-521 (MPU6050) accelerometer + DHT22 air temp/humidity + SSD1306 OLED. No pulse sensor yet.
; Flash, then set Wi-Fi/MQTT over serial:
;   pio run -e espresso -t upload && pio device monitor      then type: help
;
; ESPresso Lite + Cytron UC00A: only DTR is wired, so auto-reset into the bootloader fails.
; Hold the GPIO00 button while the upload connects (do not press RESET during the upload).

[env]
platform = espressif8266
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_extra_dirs = ../shared
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.1
build_flags = -DMQTT_MAX_PACKET_SIZE=512

[env:espresso]
board = esp_wroom_02
upload_resetmethod = ck
; the board profile assumes 2 MB with no filesystem; ESPresso Lite V2 has 4 MB flash.
; 4m1m = 1 MB LittleFS for the saved settings (without it: "LittleFS mount failed")
board_build.ldscript = eagle.flash.4m1m.ld
board_upload.maximum_size = 4194304

[env:nodemcu]
board = nodemcuv2
